_format_version: "3.0"

# STEP 2 — change plugin CONFIG only. The handler below is byte-identical to
# step 1; the only difference is the `config:` block at the bottom.
#
# start_hour == end_hour is a zero-width window: `hour >= 9 and hour < 9` is
# never true, so the gate is closed no matter what time you run this. That
# keeps the step deterministic instead of depending on when you're reading it.

custom_plugins:
  - name: business-hours-gate
    schema: |
      return {
        name = "business-hours-gate",
        fields = {
          { config = {
              type = "record",
              fields = {
                { allowed_days = {
                    type = "array",
                    elements = { type = "string", one_of = { "sun","mon","tue","wed","thu","fri","sat" } },
                    default = { "mon","tue","wed","thu","fri" },
                } },
                { start_hour = { type = "integer", between = { 0, 23 }, default = 9 } },
                { end_hour = { type = "integer", between = { 1, 24 }, default = 17 } },
                { utc_offset_hours = { type = "number", between = { -12, 14 }, default = 0 } },
                { bypass_header = { type = "string", default = "X-Break-Glass" } },
                { message = { type = "string", default = "Service is closed outside business hours." } },
              },
          } },
        },
      }
    handler: |
      local BusinessHoursGate = {
        PRIORITY = 1000,
        VERSION = "1.0.0",
      }

      local DAYS = { sun = 0, mon = 1, tue = 2, wed = 3, thu = 4, fri = 5, sat = 6 }

      function BusinessHoursGate:access(config)
        local bh = config.bypass_header
        if bh and bh ~= "" and kong.request.get_header(bh) then
          kong.service.request.set_header("X-Gate-Bypass", "true")
          return
        end

        local t    = ngx.time() + math.floor((config.utc_offset_hours or 0) * 3600)
        local days = math.floor(t / 86400)
        local dow  = (days + 4) % 7
        local hour = math.floor((t % 86400) / 3600)

        local day_ok = false
        for _, d in ipairs(config.allowed_days or {}) do
          if DAYS[d] == dow then
            day_ok = true
            break
          end
        end

        local hour_ok = (hour >= config.start_hour) and (hour < config.end_hour)

        if day_ok and hour_ok then
          kong.service.request.set_header("X-Gate", "open")
          return
        end

        local reason = (not day_ok) and "day-not-allowed" or "outside-hours"
        return kong.response.exit(503,
          { message = config.message, reason = reason, local_hour = hour, local_dow = dow },
          { ["Retry-After"] = "3600", ["X-Gate-Reason"] = reason })
      end

      return BusinessHoursGate

services:
  - name: mock
    url: http://lab-httpbin:8080/anything
    routes:
      - name: mock
        paths:
          - /mock
        strip_path: false
        plugins:
          - name: business-hours-gate
            config:
              allowed_days: ["sun","mon","tue","wed","thu","fri","sat"]
              start_hour: 9
              end_hour: 9
              utc_offset_hours: 0
