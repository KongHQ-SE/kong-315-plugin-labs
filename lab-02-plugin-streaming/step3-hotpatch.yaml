_format_version: "3.0"

# STEP 3 — change the plugin's CODE on a running fleet.
#
# Step 2 failed silently: the plugin looked up a literal key called
# "realm_access.roles" in a flat table, found nothing, and moved on. Config
# alone could never fix that. It needs new logic.
#
# Two things changed from step 2:
#   1. a lookup() helper that resolves dot-separated paths      (CODE)
#   2. the "iss" claim added to the list                        (CONFIG)
#
# The config change is not decoration. Read this carefully:
#
#   Data planes reconcile when the CONFIG PAYLOAD changes. Plugin code rides
#   along with that payload. If you edit ONLY the handler and re-sync, the
#   control plane stores your new code and the data plane keeps running the
#   OLD code — no error, no warning. Verified: a code-only change was still
#   not live after 90 seconds; adding a one-field config change made the same
#   code go live in 16 seconds. Bumping VERSION does not help either.
#
# So: when you ship a code change, ship a config change with it — or restart
# the data plane.

custom_plugins:
  - name: jwt-claims-to-headers
    schema: |
      return {
        name = "jwt-claims-to-headers",
        fields = {
          { config = {
              type = "record",
              fields = {
                { claims = { type = "array", elements = { type = "string" }, default = { "sub" } } },
                { header_prefix = { type = "string", default = "X-JWT-" } },
                { token_header = { type = "string", default = "Authorization" } },
              },
          } },
        },
      }
    handler: |
      local cjson = require("cjson.safe")

      local JwtClaimsToHeaders = {
        PRIORITY = 900,
        VERSION = "1.1.0",
      }

      local function b64url_decode(s)
        if not s then return nil end
        s = s:gsub("-", "+")
        s = s:gsub("_", "/")
        local rem = #s % 4
        if rem == 2 then s = s .. "=="
        elseif rem == 3 then s = s .. "="
        elseif rem == 1 then return nil end
        return ngx.decode_base64(s)
      end

      local function header_name(prefix, claim)
        return prefix .. (claim:gsub("[%._]", "-"))
      end

      -- Resolve a dot-separated path such as "realm_access.roles".
      local function lookup(claims, path)
        local node = claims
        for part in path:gmatch("[^%.]+") do
          if type(node) ~= "table" then return nil end
          node = node[part]
        end
        return node
      end

      local function stringify(v)
        local t = type(v)
        if t == "string" then return v end
        if t == "number" or t == "boolean" then return tostring(v) end
        if t == "table" then
          local parts = {}
          for _, item in ipairs(v) do
            if type(item) == "string" or type(item) == "number" then
              parts[#parts + 1] = tostring(item)
            end
          end
          if #parts > 0 then return table.concat(parts, ",") end
          return cjson.encode(v)
        end
        return nil
      end

      function JwtClaimsToHeaders:access(config)
        local prefix = config.header_prefix
        local lower_prefix = prefix:lower()

        -- Anti-spoofing: drop inbound headers using our prefix so a client
        -- cannot forge X-JWT-sub and impersonate somebody.
        for name, _ in pairs(kong.request.get_headers()) do
          if name:lower():find(lower_prefix, 1, true) == 1 then
            kong.service.request.clear_header(name)
          end
        end

        local auth = kong.request.get_header(config.token_header)
        if not auth then
          return
        end

        local token = auth:match("^%s*[Bb]earer%s+(.+)$") or auth
        local payload_b64 = token:match("^[^%.]+%.([^%.]+)%.")
        if not payload_b64 then
          kong.log.warn("token is not a well-formed JWT")
          return
        end

        local raw = b64url_decode(payload_b64)
        local claims = raw and cjson.decode(raw)
        if type(claims) ~= "table" then
          kong.log.warn("could not decode JWT payload")
          return
        end

        local mapped = 0
        for _, claim in ipairs(config.claims or {}) do
          local s = stringify(lookup(claims, claim))
          if s then
            kong.service.request.set_header(header_name(prefix, claim), s)
            mapped = mapped + 1
          end
        end
        kong.service.request.set_header(prefix .. "claims-mapped", tostring(mapped))
      end

      return JwtClaimsToHeaders

services:
  - name: mock
    url: http://lab-httpbin:8080/anything
    routes:
      - name: mock
        paths: [/mock]
        strip_path: false
        plugins:
          - name: jwt-claims-to-headers
            config:
              claims: ["sub", "email", "tenant_id", "roles", "realm_access.roles", "iss"]
              header_prefix: "X-JWT-"
