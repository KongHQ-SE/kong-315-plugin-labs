_format_version: "3.0"

# STEP 1 — ship a custom plugin with no image build and no file copying.
#
# `custom_plugins` carries the plugin's schema and handler as inline Lua. The
# control plane becomes the source of truth for plugin CODE, not just config,
# and streams it to every connected data plane.
#
# Streaming constraints (stricter than a file-installed plugin):
#   * Lua only
#   * exactly one schema and one handler — no extra modules
#   * no `require()` of your own modules
#   * cannot run in `init_worker`, cannot create timers
#   * no filesystem access
#
# Note this handler derives day-of-week and hour with plain arithmetic on
# ngx.time() rather than calling os.date(). That keeps it comfortably inside
# the sandbox and avoids depending on a timezone database in the container.

custom_plugins:
  - name: business-hours-gate
    schema: |
      return {
        name = "business-hours-gate",
        fields = {
          { config = {
              type = "record",
              fields = {
                { allowed_days = {
                    type = "array",
                    elements = { type = "string", one_of = { "sun","mon","tue","wed","thu","fri","sat" } },
                    default = { "mon","tue","wed","thu","fri" },
                } },
                { start_hour = { type = "integer", between = { 0, 23 }, default = 9 } },
                { end_hour = { type = "integer", between = { 1, 24 }, default = 17 } },
                { utc_offset_hours = { type = "number", between = { -12, 14 }, default = 0 } },
                { bypass_header = { type = "string", default = "X-Break-Glass" } },
                { message = { type = "string", default = "Service is closed outside business hours." } },
              },
          } },
        },
      }
    handler: |
      local BusinessHoursGate = {
        PRIORITY = 1000,
        VERSION = "1.0.0",
      }

      local DAYS = { sun = 0, mon = 1, tue = 2, wed = 3, thu = 4, fri = 5, sat = 6 }

      function BusinessHoursGate:access(config)
        -- Break-glass: let an operator through during an incident.
        local bh = config.bypass_header
        if bh and bh ~= "" and kong.request.get_header(bh) then
          kong.service.request.set_header("X-Gate-Bypass", "true")
          return
        end

        -- Epoch day 0 (1970-01-01) was a Thursday, so (days + 4) % 7 maps to
        -- 0 = Sunday .. 6 = Saturday.
        local t    = ngx.time() + math.floor((config.utc_offset_hours or 0) * 3600)
        local days = math.floor(t / 86400)
        local dow  = (days + 4) % 7
        local hour = math.floor((t % 86400) / 3600)

        local day_ok = false
        for _, d in ipairs(config.allowed_days or {}) do
          if DAYS[d] == dow then
            day_ok = true
            break
          end
        end

        local hour_ok = (hour >= config.start_hour) and (hour < config.end_hour)

        if day_ok and hour_ok then
          kong.service.request.set_header("X-Gate", "open")
          return
        end

        local reason = (not day_ok) and "day-not-allowed" or "outside-hours"
        return kong.response.exit(503,
          { message = config.message, reason = reason, local_hour = hour, local_dow = dow },
          { ["Retry-After"] = "3600", ["X-Gate-Reason"] = reason })
      end

      return BusinessHoursGate

services:
  - name: mock
    url: http://lab-httpbin:8080/anything
    routes:
      - name: mock
        paths:
          - /mock
        strip_path: false
        plugins:
          - name: business-hours-gate
            config:
              # Wide open, so this step gives the same result whenever you run it.
              allowed_days: ["sun","mon","tue","wed","thu","fri","sat"]
              start_hour: 0
              end_hour: 24
              utc_offset_hours: 0
